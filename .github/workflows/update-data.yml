name: Mise à jour quotidienne des délais

on:
  schedule:
    # 05:30 UTC = 06:30/07:30 heure de Paris selon la saison
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scraper/requirements.txt

      - name: Lancer le scraper
        run: python scraper/scrape_caf.py
        continue-on-error: true   # on publie quand même le site même si une partie échoue

      - name: Committer les données mises à jour
        run: |
          git config user.name "delais-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/delais.json data/scrape_report.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique des délais [skip ci]"
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
